<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mr. TEA — Jeopardy</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root {
    /* mr. TEA Dark Theme Variables */
    --bg-primary: #0c1017;
    --bg-secondary: #141820;
    --bg-card: rgba(20, 24, 32, 0.85);
    --bg-glass: rgba(255, 255, 255, 0.04);
    --bg-code: #1a1f2e;
    --border: rgba(255, 255, 255, 0.07);
    --border-hover: rgba(255, 255, 255, 0.14);

    --text-primary: #eef2f7;
    --text-secondary: #8b949e;
    --text-muted: #5c6370;

    --accent-tea: linear-gradient(135deg, #0d9488, #06b6d4);
    --clr-tea: #2dd4bf;
    --clr-python: #10b981;
    --clr-red: #f43f5e;
    --clr-orange: #f97316;

    --font-body: 'Inter', sans-serif;
    --font-code: 'JetBrains Mono', monospace;
    
    --radius-sm: 0.375rem;
    --radius-md: 0.5rem;
    --radius-lg: 0.75rem;
    --radius-xl: 1rem;
    --radius-full: 9999px;

    --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
    --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.35);
    --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.4);
    --shadow-glow: 0 0 40px rgba(13, 148, 136, 0.15);

    --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    
    --space-xs: 0.25rem;
    --space-sm: 0.5rem;
    --space-md: 1rem;
    --space-lg: 1.5rem;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg-primary);
    font-family: var(--font-body);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* ── TOP BAR ── */
  #topbar {
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    padding: var(--space-sm) var(--space-lg);
    display: flex;
    align-items: center;
    justify-content: space-between;
    backdrop-filter: blur(20px);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  #game-title-display {
    font-size: 1.25rem;
    font-weight: 800;
    color: var(--text-primary);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: var(--space-sm);
  }
  #game-title-display i {
    color: var(--clr-tea);
  }

  .top-actions { display: flex; gap: var(--space-sm); align-items: center; }

  /* ── BUTTONS ── */
  .btn {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 0.875rem;
    cursor: pointer;
    padding: 8px 16px;
    border-radius: var(--radius-md);
    transition: all var(--transition);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: 1px solid transparent;
  }
  .btn-tea {
    background: rgba(13, 148, 136, 0.12);
    color: var(--clr-tea);
  }
  .btn-tea:hover { background: rgba(13, 148, 136, 0.2); }
  
  .btn-outline {
    background: var(--bg-glass);
    color: var(--text-secondary);
    border-color: var(--border);
  }
  .btn-outline:hover {
    background: var(--bg-code);
    color: var(--text-primary);
    border-color: var(--border-hover);
  }
  
  .btn-red { background: rgba(244, 63, 94, 0.12); color: var(--clr-red); }
  .btn-red:hover { background: rgba(244, 63, 94, 0.2); }
  
  .btn-green { background: rgba(16, 185, 129, 0.12); color: var(--clr-python); }
  .btn-green:hover { background: rgba(16, 185, 129, 0.2); }
  
  .btn-sm { font-size: 0.75rem; padding: 6px 12px; }

  /* ── MAIN GAME ── */
  #game-view { display: flex; flex-direction: column; align-items: center; padding: var(--space-lg); gap: var(--space-lg); }

  /* ── BOARD ── */
  #board-wrap { width: 100%; max-width: 1200px; }

  #board {
    display: grid;
    gap: var(--space-sm);
    background: var(--bg-secondary);
    padding: var(--space-sm);
    border-radius: var(--radius-xl);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-lg);
  }

  .cat-header {
    background: var(--bg-code);
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: var(--space-md) var(--space-sm);
    font-weight: 700;
    font-size: clamp(0.85rem, 1.2vw, 1rem);
    color: var(--text-primary);
    min-height: 70px;
    border: 1px solid var(--border);
  }

  .cell {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all var(--transition);
    min-height: 80px;
    position: relative;
  }
  .cell:hover:not(.used) {
    border-color: var(--clr-tea);
    box-shadow: var(--shadow-glow);
    transform: translateY(-2px);
    z-index: 2;
  }
  .cell.used {
    background: var(--bg-glass);
    border-color: transparent;
    opacity: 0.4;
    cursor: default;
  }

  .cell-value {
    font-family: var(--font-code);
    font-size: clamp(1.2rem, 2.5vw, 1.8rem);
    font-weight: 700;
    color: var(--clr-tea);
  }
  .cell.used .cell-value { color: var(--text-muted); }

  /* ── SCORES ── */
  #scoreboard {
    display: flex;
    gap: var(--space-md);
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
    max-width: 1200px;
  }

  .team-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    padding: var(--space-md) var(--space-lg);
    min-width: 160px;
    text-align: center;
    transition: all var(--transition);
    box-shadow: var(--shadow-sm);
  }

  .team-name-label {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-secondary);
    cursor: pointer;
    margin-bottom: var(--space-xs);
  }
  
  .team-name-input {
    background: var(--bg-code);
    border: 1px solid var(--clr-tea);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    font-family: var(--font-body);
    font-size: 0.85rem;
    text-align: center;
    width: 100%;
    outline: none;
    display: none;
    padding: 4px;
    margin-bottom: var(--space-xs);
  }

  .team-score {
    font-family: var(--font-code);
    font-weight: 700;
    font-size: 2rem;
    color: var(--text-primary);
    line-height: 1.2;
    margin: 8px 0;
  }
  .team-score.positive { color: var(--clr-python); }
  .team-score.negative { color: var(--clr-red); }

  .score-btns { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
  
  .score-btn {
    width: 32px; height: 32px;
    border-radius: var(--radius-md);
    border: 1px solid transparent;
    font-size: 1rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all var(--transition);
  }
  .score-btn.plus { background: rgba(16, 185, 129, 0.12); color: var(--clr-python); }
  .score-btn.plus:hover { background: rgba(16, 185, 129, 0.2); }
  .score-btn.minus { background: rgba(244, 63, 94, 0.12); color: var(--clr-red); }
  .score-btn.minus:hover { background: rgba(244, 63, 94, 0.2); }

  #add-team-btn {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; cursor: pointer;
    background: var(--bg-glass);
    border: 1px dashed var(--border);
    border-radius: var(--radius-xl);
    padding: var(--space-md) var(--space-lg);
    min-width: 120px;
    color: var(--text-muted);
    font-family: var(--font-body);
    font-size: 0.85rem;
    font-weight: 600;
    transition: all var(--transition);
  }
  #add-team-btn:hover { border-color: var(--border-hover); color: var(--text-primary); }

  /* ── QUESTION MODAL ── */
  #q-modal {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: var(--space-lg);
  }
  #q-modal.open { display: flex; }

  #q-box {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: var(--radius-2xl);
    padding: var(--space-2xl);
    max-width: 800px;
    width: 100%;
    text-align: center;
    position: relative;
    box-shadow: var(--shadow-xl);
    animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes popIn {
    from { transform: scale(0.95); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  #q-points-badge {
    font-family: var(--font-code);
    font-weight: 700;
    font-size: 1.25rem;
    color: var(--clr-tea);
    margin-bottom: var(--space-sm);
    display: inline-block;
    padding: 4px 12px;
    background: rgba(13, 148, 136, 0.12);
    border-radius: var(--radius-md);
  }

  #q-category-badge {
    font-size: 0.85rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-secondary);
    margin-bottom: var(--space-xl);
  }

  #q-text {
    font-size: clamp(1.25rem, 3vw, 1.75rem);
    font-weight: 600;
    line-height: 1.5;
    color: var(--text-primary);
    margin-bottom: var(--space-2xl);
    min-height: 80px;
    display: flex; align-items: center; justify-content: center;
  }

  #reveal-btn {
    background: var(--accent-tea);
    color: #fff;
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 1rem;
    border: none;
    padding: 12px 32px;
    border-radius: var(--radius-full);
    cursor: pointer;
    transition: all var(--transition);
    box-shadow: var(--shadow-sm);
  }
  #reveal-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }

  #a-text {
    display: none;
    font-family: var(--font-body);
    font-weight: 700;
    font-size: clamp(1.1rem, 2.5vw, 1.5rem);
    color: var(--clr-python);
    margin-bottom: var(--space-xl);
    animation: fadeUp 0.3s ease;
    padding: var(--space-md);
    background: rgba(16, 185, 129, 0.08);
    border-radius: var(--radius-lg);
  }
  
  @keyframes fadeUp {
    from { transform: translateY(10px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  #q-score-actions {
    display: none;
    flex-wrap: wrap;
    gap: var(--space-sm);
    justify-content: center;
    margin-bottom: var(--space-lg);
  }

  .award-btn {
    background: var(--bg-glass);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 8px 16px;
    color: var(--text-secondary);
    font-family: var(--font-code);
    font-size: 0.875rem;
    cursor: pointer;
    transition: all var(--transition);
  }
  .award-btn:hover { border-color: var(--clr-python); color: var(--clr-python); background: rgba(16,185,129,0.1); }
  .award-btn.deduct:hover { border-color: var(--clr-red); color: var(--clr-red); background: rgba(244,63,94,0.1); }

  #close-q {
    position: absolute; top: var(--space-md); right: var(--space-md);
    background: var(--bg-glass); border: none;
    width: 36px; height: 36px;
    border-radius: var(--radius-full);
    font-size: 1.2rem; color: var(--text-secondary);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all var(--transition);
  }
  #close-q:hover { background: var(--border); color: var(--text-primary); }

  /* ── EDITOR ── */
  #editor-view {
    display: none;
    padding: var(--space-xl);
    max-width: 1100px;
    margin: 0 auto;
  }

  .editor-header {
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--text-primary);
    margin-bottom: var(--space-xl);
    display: flex;
    align-items: center;
    gap: var(--space-md);
  }

  .editor-section {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    margin-bottom: var(--space-lg);
    overflow: hidden;
  }

  .editor-section-head {
    background: var(--bg-code);
    padding: var(--space-md);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-sm);
    border-bottom: 1px solid var(--border);
  }

  .cat-name-input {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    font-family: var(--font-body);
    font-weight: 600;
    padding: 8px 12px;
    width: 250px;
    outline: none;
    transition: border-color var(--transition);
  }
  .cat-name-input:focus { border-color: var(--clr-tea); }

  .q-row {
    display: grid;
    grid-template-columns: 80px 1fr 1fr 40px;
    gap: var(--space-sm);
    padding: var(--space-sm) var(--space-md);
    border-bottom: 1px solid var(--border);
    align-items: center;
  }
  .q-row:last-child { border-bottom: none; }

  .pts-input, .q-input, .a-input {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    font-family: var(--font-body);
    font-size: 0.875rem;
    padding: 8px 12px;
    outline: none;
    width: 100%;
    transition: border-color var(--transition);
  }
  .pts-input:focus, .q-input:focus, .a-input:focus { border-color: var(--clr-tea); }
  .pts-input { text-align: center; font-family: var(--font-code); font-weight: 600; }

  .row-label {
    font-size: 0.75rem;
    color: var(--text-muted);
    font-weight: 600;
    text-transform: uppercase;
    text-align: center;
  }

  .del-row-btn {
    background: none; border: none;
    color: var(--text-muted); font-size: 1rem;
    cursor: pointer; transition: color var(--transition);
    display: flex; align-items: center; justify-content: center;
  }
  .del-row-btn:hover { color: var(--clr-red); }

  #editor-controls {
    display: flex; gap: var(--space-sm); margin-bottom: var(--space-xl); flex-wrap: wrap; align-items: center;
  }

  .title-edit-row {
    display: flex; align-items: center; gap: var(--space-md); margin-bottom: var(--space-xl);
  }
  .title-edit-label {
    font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase;
  }
  .title-edit-input {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    color: var(--text-primary);
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 1.25rem;
    padding: 8px 16px;
    outline: none;
    width: 320px;
    transition: border-color var(--transition);
  }
  .title-edit-input:focus { border-color: var(--clr-tea); }

  #editor-cols { display: flex; flex-direction: column; gap: 0; }

  /* ── TOAST ── */
  #toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: var(--text-primary); color: var(--bg-primary);
    font-family: var(--font-body); font-weight: 600; font-size: 0.875rem;
    padding: 12px 24px; border-radius: var(--radius-full);
    opacity: 0; pointer-events: none;
    transition: opacity var(--transition);
    z-index: 999;
    box-shadow: var(--shadow-lg);
  }
  #toast.show { opacity: 1; }

  @media (max-width: 768px) {
    .q-row { grid-template-columns: 60px 1fr 1fr 30px; gap: 8px; padding: 12px; }
    #q-box { padding: var(--space-xl) var(--space-md); }
  }
</style>
</head>
<body>

<div id="topbar">
  <div id="game-title-display"><i class="fas fa-mug-hot"></i> Jeopardy!</div>
  <div class="top-actions">
    <button class="btn btn-outline" onclick="showEditor()"><i class="fas fa-edit"></i> Edit Board</button>
    <button class="btn btn-tea" onclick="resetGame()"><i class="fas fa-redo"></i> Reset Game</button>
  </div>
</div>

<div id="game-view">
  <div id="board-wrap">
    <div id="board"></div>
  </div>
  <div id="scoreboard"></div>
</div>

<div id="editor-view">
  <div class="editor-header">
    <i class="fas fa-list-check"></i> Board Editor
    <button class="btn btn-green btn-sm" onclick="saveAndPlay()"><i class="fas fa-play"></i> Save & Play</button>
    <button class="btn btn-outline btn-sm" onclick="showGame()"><i class="fas fa-times"></i> Cancel</button>
  </div>

  <div class="title-edit-row">
    <span class="title-edit-label">Game Title</span>
    <input class="title-edit-input" id="title-input" value="Jeopardy!" />
  </div>

  <div id="editor-controls">
    <button class="btn btn-tea btn-sm" onclick="addCategory()"><i class="fas fa-plus"></i> Category</button>
    <button class="btn btn-outline btn-sm" onclick="addRowToAll()"><i class="fas fa-plus"></i> Row to All</button>
    <button class="btn btn-outline btn-sm" onclick="importJSON()"><i class="fas fa-file-import"></i> Import JSON</button>
    <button class="btn btn-outline btn-sm" onclick="exportJSON()"><i class="fas fa-file-export"></i> Export JSON</button>
  </div>

  <div id="editor-cols"></div>
</div>

<div id="q-modal">
  <div id="q-box">
    <button id="close-q" onclick="closeQuestion()"><i class="fas fa-times"></i></button>
    <div><div id="q-points-badge"></div></div>
    <div id="q-category-badge"></div>
    <div id="q-text"></div>
    <button id="reveal-btn" onclick="revealAnswer()">Reveal Answer</button>
    <div id="a-text"></div>
    <div id="q-score-actions"></div>
    <div style="margin-top:16px">
      <button class="btn btn-outline btn-sm" onclick="closeQuestion(false)"><i class="fas fa-forward-step"></i> Skip / No Score</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ═══════════════════════════════════════════
//  DEFAULT GAME DATA
// ═══════════════════════════════════════════
const defaultData = {
  title: "A-Level Computer Science",
  categories: [
    {
      name: "Security & Privacy",
      questions: [
        { points: 100, q: "Define the term 'computer security.'", a: "Protecting computer systems, networks, and data from unauthorised access, damage, or attack." },
        { points: 200, q: "What is the difference between 'privacy' and 'data integrity'?", a: "Privacy: an individual's right to control data. Data Integrity: ensuring data remains accurate and unaltered." },
        { points: 300, q: "Give TWO reasons why protecting personal data is important.", a: "Prevent identity theft, avoid financial harm, maintain user trust, comply with GDPR." }
      ]
    },
    {
      name: "Safety Methods",
      questions: [
        { points: 100, q: "What is a data backup and why is it important?", a: "A copy of data stored separately to allow recovery if original is lost." },
        { points: 200, q: "Explain how disk mirroring (RAID 1) works.", a: "Data is written simultaneously to two drives." },
        { points: 300, q: "Explain how encryption protects stored data.", a: "Converts data into an unreadable format requiring a decryption key." }
      ]
    },
    {
      name: "Networks",
      questions: [
        { points: 100, q: "State TWO differences between a LAN and a WAN.", a: "LAN is small area and private. WAN is large geographical area and uses public infrastructure." },
        { points: 200, q: "Describe the star topology.", a: "All devices connect to a central switch." },
        { points: 300, q: "Explain the difference between a router and a switch.", a: "Router connects different networks (IP). Switch connects devices in the same LAN (MAC)." }
      ]
    }
  ]
};

// ═══════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════
let gameData = JSON.parse(JSON.stringify(defaultData));
let used = {}; 
let teams = [
  { name: "Team 1", score: 0 },
  { name: "Team 2", score: 0 }
];
let activeQ = null; 

// ═══════════════════════════════════════════
//  BOARD RENDERING
// ═══════════════════════════════════════════
function buildBoard() {
  const board = document.getElementById('board');
  const cols = gameData.categories.length;
  const maxRows = Math.max(...gameData.categories.map(c => c.questions.length));

  board.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  board.innerHTML = '';

  gameData.categories.forEach(cat => {
    const h = document.createElement('div');
    h.className = 'cat-header';
    h.textContent = cat.name;
    board.appendChild(h);
  });

  for (let r = 0; r < maxRows; r++) {
    for (let c = 0; c < cols; c++) {
      const q = gameData.categories[c].questions[r];
      const cell = document.createElement('div');
      cell.className = 'cell';
      const key = `${c}-${r}`;
      
      if (used[key]) {
        cell.classList.add('used');
        cell.innerHTML = `<span class="cell-value">—</span>`;
      } else if (q) {
        cell.innerHTML = `<span class="cell-value">${q.points}</span>`;
        cell.onclick = () => openQuestion(c, r);
      } else {
        cell.classList.add('used');
      }
      board.appendChild(cell);
    }
  }

  document.getElementById('game-title-display').innerHTML = '<i class="fas fa-mug-hot"></i> ' + gameData.title;
  document.title = gameData.title;
}

// ═══════════════════════════════════════════
//  QUESTION MODAL
// ═══════════════════════════════════════════
function openQuestion(colIdx, rowIdx) {
  const q = gameData.categories[colIdx].questions[rowIdx];
  if (!q) return;
  activeQ = { colIdx, rowIdx, points: q.points };

  document.getElementById('q-points-badge').textContent = `${q.points} PTS`;
  document.getElementById('q-category-badge').textContent = gameData.categories[colIdx].name;
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('a-text').textContent = q.a;
  document.getElementById('a-text').style.display = 'none';
  document.getElementById('reveal-btn').style.display = 'inline-block';
  document.getElementById('q-score-actions').style.display = 'none';
  document.getElementById('q-modal').classList.add('open');
}

function revealAnswer() {
  document.getElementById('a-text').style.display = 'block';
  document.getElementById('reveal-btn').style.display = 'none';
  buildScoreActions();
  document.getElementById('q-score-actions').style.display = 'flex';
}

function buildScoreActions() {
  const div = document.getElementById('q-score-actions');
  div.innerHTML = '';
  teams.forEach((t, i) => {
    const pts = activeQ ? activeQ.points : 0;
    
    const add = document.createElement('button');
    add.className = 'award-btn';
    add.innerHTML = `<i class="fas fa-check"></i> ${t.name} +${pts}`;
    add.onclick = () => { adjustScore(i, pts); closeQuestion(true); };
    div.appendChild(add);

    const sub = document.createElement('button');
    sub.className = 'award-btn deduct';
    sub.innerHTML = `<i class="fas fa-times"></i> ${t.name} -${pts}`;
    sub.onclick = () => { adjustScore(i, -pts); closeQuestion(true); };
    div.appendChild(sub);
  });
}

function closeQuestion(markUsed = true) {
  if (markUsed && activeQ) {
    const key = `${activeQ.colIdx}-${activeQ.rowIdx}`;
    used[key] = true;
    buildBoard();
  }
  document.getElementById('q-modal').classList.remove('open');
  activeQ = null;
}

// ═══════════════════════════════════════════
//  SCOREBOARD
// ═══════════════════════════════════════════
function buildScoreboard() {
  const sb = document.getElementById('scoreboard');
  sb.innerHTML = '';

  teams.forEach((t, i) => {
    const card = document.createElement('div');
    card.className = 'team-card';
    card.id = `team-card-${i}`;

    const nameLabel = document.createElement('div');
    nameLabel.className = 'team-name-label';
    nameLabel.textContent = t.name;
    nameLabel.title = 'Click to rename';
    nameLabel.onclick = () => startRenameTeam(i);

    const nameInput = document.createElement('input');
    nameInput.className = 'team-name-input';
    nameInput.id = `team-name-input-${i}`;
    nameInput.value = t.name;
    nameInput.onblur = () => finishRenameTeam(i);
    nameInput.onkeydown = e => { if (e.key === 'Enter') finishRenameTeam(i); };

    const scoreDiv = document.createElement('div');
    scoreDiv.className = 'team-score' + (t.score > 0 ? ' positive' : t.score < 0 ? ' negative' : '');
    scoreDiv.id = `team-score-${i}`;
    scoreDiv.textContent = t.score;

    const btnRow = document.createElement('div');
    btnRow.className = 'score-btns';

    const plus = document.createElement('button');
    plus.className = 'score-btn plus';
    plus.innerHTML = '<i class="fas fa-plus"></i>';
    plus.onclick = () => {
      const v = parseInt(prompt('Add points:', '100')) || 0;
      adjustScore(i, v);
    };

    const minus = document.createElement('button');
    minus.className = 'score-btn minus';
    minus.innerHTML = '<i class="fas fa-minus"></i>';
    minus.onclick = () => {
      const v = parseInt(prompt('Deduct points:', '100')) || 0;
      adjustScore(i, -v);
    };

    const del = document.createElement('button');
    del.className = 'score-btn';
    del.style.cssText = 'background:var(--bg-glass);color:var(--text-muted);';
    del.innerHTML = '<i class="fas fa-trash"></i>';
    del.title = 'Remove team';
    del.onclick = () => removeTeam(i);

    btnRow.append(plus, minus, del);
    card.append(nameLabel, nameInput, scoreDiv, btnRow);
    sb.appendChild(card);
  });

  const addBtn = document.createElement('button');
  addBtn.id = 'add-team-btn';
  addBtn.innerHTML = '<i class="fas fa-users" style="font-size:1.25rem"></i><span>Add Team</span>';
  addBtn.onclick = () => {
    teams.push({ name: `Team ${teams.length + 1}`, score: 0 });
    buildScoreboard();
  };
  sb.appendChild(addBtn);
}

function adjustScore(teamIdx, delta) {
  teams[teamIdx].score += delta;
  const scoreEl = document.getElementById(`team-score-${teamIdx}`);
  if (scoreEl) {
    scoreEl.textContent = teams[teamIdx].score;
    scoreEl.className = 'team-score' + (teams[teamIdx].score > 0 ? ' positive' : teams[teamIdx].score < 0 ? ' negative' : '');
  }
  
  const card = document.getElementById(`team-card-${teamIdx}`);
  if (card) {
    card.style.transition = 'box-shadow 0.2s';
    card.style.boxShadow = delta >= 0 ? '0 0 20px rgba(16, 185, 129, 0.3)' : '0 0 20px rgba(244, 63, 94, 0.3)';
    setTimeout(() => { card.style.boxShadow = 'var(--shadow-sm)'; }, 400);
  }
}

function startRenameTeam(i) {
  const label = document.querySelector(`#team-card-${i} .team-name-label`);
  const input = document.getElementById(`team-name-input-${i}`);
  label.style.display = 'none';
  input.style.display = 'block';
  input.focus();
  input.select();
}

function finishRenameTeam(i) {
  const input = document.getElementById(`team-name-input-${i}`);
  const label = document.querySelector(`#team-card-${i} .team-name-label`);
  teams[i].name = input.value || teams[i].name;
  label.textContent = teams[i].name;
  label.style.display = '';
  input.style.display = 'none';
}

function removeTeam(i) {
  if (teams.length <= 1) { toast('Need at least one team!'); return; }
  teams.splice(i, 1);
  buildScoreboard();
}

// ═══════════════════════════════════════════
//  EDITOR
// ═══════════════════════════════════════════
function showEditor() {
  document.getElementById('game-view').style.display = 'none';
  document.getElementById('editor-view').style.display = 'block';
  renderEditor();
}

function showGame() {
  document.getElementById('editor-view').style.display = 'none';
  document.getElementById('game-view').style.display = 'flex';
}

function renderEditor() {
  document.getElementById('title-input').value = gameData.title;
  const container = document.getElementById('editor-cols');
  container.innerHTML = '';

  gameData.categories.forEach((cat, ci) => {
    const section = document.createElement('div');
    section.className = 'editor-section';

    const head = document.createElement('div');
    head.className = 'editor-section-head';

    const nameInput = document.createElement('input');
    nameInput.className = 'cat-name-input';
    nameInput.value = cat.name;
    nameInput.placeholder = 'Category Name';
    nameInput.oninput = e => { cat.name = e.target.value; };

    const actions = document.createElement('div');
    actions.style.display = 'flex'; actions.style.gap = '8px';

    const addRowBtn = document.createElement('button');
    addRowBtn.className = 'btn btn-outline btn-sm';
    addRowBtn.innerHTML = '<i class="fas fa-plus"></i> Row';
    addRowBtn.onclick = () => {
      const lastPts = cat.questions.length ? cat.questions[cat.questions.length-1].points + 100 : 100;
      cat.questions.push({ points: lastPts, q: '', a: '' });
      renderEditor();
    };

    const delCatBtn = document.createElement('button');
    delCatBtn.className = 'btn btn-red btn-sm';
    delCatBtn.innerHTML = '<i class="fas fa-trash"></i> Category';
    delCatBtn.onclick = () => {
      if (gameData.categories.length <= 1) { toast("Need at least 1 category!"); return; }
      gameData.categories.splice(ci, 1);
      renderEditor();
    };

    actions.append(addRowBtn, delCatBtn);
    head.append(nameInput, actions);
    section.appendChild(head);

    const labelRow = document.createElement('div');
    labelRow.className = 'q-row';
    labelRow.innerHTML = `<div class="row-label">Points</div><div class="row-label">Question / Clue</div><div class="row-label">Answer</div><div></div>`;
    section.appendChild(labelRow);

    cat.questions.forEach((qObj, qi) => {
      const row = document.createElement('div');
      row.className = 'q-row';

      const ptsIn = document.createElement('input');
      ptsIn.className = 'pts-input';
      ptsIn.type = 'number';
      ptsIn.value = qObj.points;
      ptsIn.min = 0;
      ptsIn.oninput = e => { qObj.points = parseInt(e.target.value) || 0; };

      const qIn = document.createElement('input');
      qIn.className = 'q-input';
      qIn.value = qObj.q;
      qIn.placeholder = 'Enter clue / question…';
      qIn.oninput = e => { qObj.q = e.target.value; };

      const aIn = document.createElement('input');
      aIn.className = 'a-input';
      aIn.value = qObj.a;
      aIn.placeholder = 'Enter answer…';
      aIn.oninput = e => { qObj.a = e.target.value; };

      const delBtn = document.createElement('button');
      delBtn.className = 'del-row-btn';
      delBtn.innerHTML = '<i class="fas fa-trash-alt"></i>';
      delBtn.title = 'Delete row';
      delBtn.onclick = () => {
        if (cat.questions.length <= 1) { toast("Need at least 1 row!"); return; }
        cat.questions.splice(qi, 1);
        renderEditor();
      };

      row.append(ptsIn, qIn, aIn, delBtn);
      section.appendChild(row);
    });

    container.appendChild(section);
  });
}

function addCategory() {
  const rows = gameData.categories[0]?.questions.length || 5;
  const questions = [];
  for (let r = 0; r < rows; r++) questions.push({ points: (r+1)*100, q: '', a: '' });
  gameData.categories.push({ name: 'New Category', questions });
  renderEditor();
}

function addRowToAll() {
  gameData.categories.forEach(cat => {
    const lastPts = cat.questions.length ? cat.questions[cat.questions.length-1].points + 100 : 100;
    cat.questions.push({ points: lastPts, q: '', a: '' });
  });
  renderEditor();
}

function saveAndPlay() {
  gameData.title = document.getElementById('title-input').value || 'Jeopardy!';
  used = {};
  buildBoard();
  buildScoreboard();
  showGame();
  toast('Board saved! Game reset.');
}

function resetGame() {
  if (!confirm('Reset all scores and mark all questions as unplayed?')) return;
  used = {};
  teams.forEach(t => t.score = 0);
  buildBoard();
  buildScoreboard();
  toast('Game reset!');
}

function exportJSON() {
  const json = JSON.stringify(gameData, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'jeopardy-data.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('Exported!');
}

function importJSON() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if (data.categories && Array.isArray(data.categories)) {
          gameData = data;
          renderEditor();
          toast('Imported!');
        } else {
          toast('Invalid format!');
        }
      } catch { toast('Failed to parse JSON!'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

document.getElementById('q-modal').addEventListener('click', e => {
  if (e.target === document.getElementById('q-modal')) closeQuestion(false);
});

buildBoard();
buildScoreboard();
</script>
</body>
</html>
