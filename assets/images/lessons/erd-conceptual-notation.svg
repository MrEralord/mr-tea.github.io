<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif">
  
  <rect width="960" height="540" fill="#ffffff" />

  
  <text x="32" y="48" font-size="30" font-weight="800" fill="#000000">Logical ERD Notation (Crow's Foot)</text>
  <text x="32" y="74" font-size="16" fill="#64748b">The standard used in Cambridge AS &amp; A Level: entity tables, PK/FK attributes, and Crow's Foot cardinality.</text>

  
  <g transform="translate(50, 125)">
    <rect x="0" y="0" width="210" height="125" rx="4" fill="#f8d7da" stroke="#000000" stroke-width="2" />
    <line x1="0" y1="38" x2="210" y2="38" stroke="#000000" stroke-width="2" />
    <text x="105" y="25" font-size="16" font-weight="800" text-anchor="middle" fill="#000000">STUDENT</text>
    
    
    <text x="14" y="64" font-size="14" font-weight="700" fill="#000000">PK</text>
    <text x="46" y="64" font-size="14" font-weight="700" text-decoration="underline" fill="#000000">StudentID</text>
    
    <text x="46" y="92" font-size="14" fill="#1e293b">Name</text>
    <text x="46" y="114" font-size="14" fill="#1e293b">Email</text>
  </g>

  
  <g transform="translate(365, 115)">
    <rect x="0" y="0" width="230" height="145" rx="4" fill="#f1f5f9" stroke="#000000" stroke-width="2" />
    <line x1="0" y1="38" x2="230" y2="38" stroke="#000000" stroke-width="2" />
    <text x="115" y="25" font-size="16" font-weight="800" text-anchor="middle" fill="#000000">ENROLLMENT</text>
    
    
    <text x="14" y="64" font-size="14" font-weight="700" fill="#000000">PK</text>
    <text x="46" y="64" font-size="14" font-weight="700" text-decoration="underline" fill="#000000">EnrollmentID</text>
    
    <text x="14" y="90" font-size="14" font-weight="700" fill="#dc2626">FK</text>
    <text x="46" y="90" font-size="14" font-style="italic" fill="#000000">StudentID</text>
    
    <text x="14" y="116" font-size="14" font-weight="700" fill="#dc2626">FK</text>
    <text x="46" y="116" font-size="14" font-style="italic" fill="#000000">CourseID</text>

    <text x="46" y="138" font-size="14" fill="#1e293b">EnrollDate</text>
  </g>

  
  <g transform="translate(700, 125)">
    <rect x="0" y="0" width="210" height="125" rx="4" fill="#f5e6ab" stroke="#000000" stroke-width="2" />
    <line x1="0" y1="38" x2="210" y2="38" stroke="#000000" stroke-width="2" />
    <text x="105" y="25" font-size="16" font-weight="800" text-anchor="middle" fill="#000000">COURSE</text>
    
    
    <text x="14" y="64" font-size="14" font-weight="700" fill="#000000">PK</text>
    <text x="46" y="64" font-size="14" font-weight="700" text-decoration="underline" fill="#000000">CourseID</text>
    
    <text x="46" y="92" font-size="14" fill="#1e293b">CourseName</text>
    <text x="46" y="114" font-size="14" fill="#1e293b">Credits</text>
  </g>

  
  <g stroke="#000000" stroke-width="2" fill="none">
    <line x1="260" y1="187" x2="365" y2="187" />
    
    <line x1="270" y1="177" x2="270" y2="197" />
    <line x1="277" y1="177" x2="277" y2="197" />
    
    <circle cx="345" cy="187" r="5" fill="#ffffff" />
    <line x1="350" y1="187" x2="365" y2="177" />
    <line x1="350" y1="187" x2="365" y2="197" />
  </g>
  <text x="312" y="172" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">takes (1:M)</text>

  
  <g stroke="#000000" stroke-width="2" fill="none">
    <line x1="595" y1="187" x2="700" y2="187" />
    
    <circle cx="615" cy="187" r="5" fill="#ffffff" />
    <line x1="610" y1="187" x2="595" y2="177" />
    <line x1="610" y1="187" x2="595" y2="197" />
    
    <line x1="683" y1="177" x2="683" y2="197" />
    <line x1="690" y1="177" x2="690" y2="197" />
  </g>
  <text x="648" y="172" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">has (1:M)</text>

  
  <g transform="translate(65, 325)">
    
    <text x="0" y="0" font-size="16" font-weight="800" fill="#000000">Entity Box</text>
    <text x="0" y="24" font-size="14" fill="#64748b">Table with attributes inside</text>

    
    <text x="230" y="0" font-size="16" font-weight="800" fill="#000000">PK / FK</text>
    <text x="230" y="24" font-size="14" fill="#64748b">Primary &amp; Foreign Keys</text>

    
    <text x="450" y="0" font-size="16" font-weight="800" fill="#000000">|| (One)</text>
    <text x="450" y="24" font-size="14" fill="#64748b">Mandatory single instance</text>

    
    <text x="670" y="0" font-size="16" font-weight="800" fill="#000000">o&lt; (Zero or Many)</text>
    <text x="670" y="24" font-size="14" fill="#64748b">Optional multiple instances</text>
  </g>

  
  <rect x="50" y="405" width="860" height="75" rx="12" fill="#f4f5f7" stroke="#000000" stroke-width="1.5" />
  <text x="72" y="448" font-size="16" font-weight="800" fill="#000000">Logical ERD resolves M:N relationships using a junction table (ENROLLMENT) and foreign keys.</text>
</svg>