<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="460" viewBox="0 0 1350 460" role="img">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0L10 5L0 10z" fill="#0F172A"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="675" y="42" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" text-anchor="middle" fill="#0F172A">Converting Analogue Sound to Digital Data</text>
<rect x="45" y="130" width="240" height="145" rx="16" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/>
<text x="165" y="175" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#0F172A">Analogue waveform</text>
<text x="165" y="215" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#475569">continuous signal</text>
<rect x="335" y="130" width="240" height="145" rx="16" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/>
<text x="455" y="175" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#0F172A">Sample</text>
<text x="455" y="215" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#475569">measure amplitude</text>
<rect x="625" y="130" width="240" height="145" rx="16" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="2"/>
<text x="745" y="175" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#0F172A">Quantise</text>
<text x="745" y="215" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#475569">choose nearest level</text>
<rect x="915" y="130" width="240" height="145" rx="16" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="2"/>
<text x="1035" y="175" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#0F172A">Encode</text>
<text x="1035" y="215" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#475569">store binary value</text>
<line x1="285" y1="202" x2="317" y2="202" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="575" y1="202" x2="607" y2="202" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="865" y1="202" x2="897" y2="202" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="1195" y="130" width="110" height="145" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="1250" y="175" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#0F172A">Digital</text>
<text x="1250" y="214" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" text-anchor="middle" fill="#0F766E">101101...</text>
<line x1="1155" y1="202" x2="1178" y2="202" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="675" y="360" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#0F766E">A computer stores and processes the resulting sample values as binary digits.</text>
