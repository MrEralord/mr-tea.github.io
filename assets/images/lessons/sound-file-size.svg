<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="450" viewBox="0 0 1350 450" role="img">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0L10 5L0 10z" fill="#0F172A"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="675" y="42" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" text-anchor="middle" fill="#0F172A">Uncompressed Audio Data Size</text>
<rect x="55" y="150" width="200" height="120" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="155" y="190" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" text-anchor="middle" fill="#0F172A">Sample rate</text>
<text x="155" y="226" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">samples/s</text>
<line x1="255" y1="210" x2="301" y2="210" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="315" y="150" width="200" height="120" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="415" y="190" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" text-anchor="middle" fill="#0F172A">× Bit depth</text>
<text x="415" y="226" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">bits/sample</text>
<line x1="515" y1="210" x2="561" y2="210" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="575" y="150" width="200" height="120" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="675" y="190" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" text-anchor="middle" fill="#0F172A">× Channels</text>
<text x="675" y="226" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">1 mono / 2 stereo</text>
<line x1="775" y1="210" x2="821" y2="210" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="835" y="150" width="200" height="120" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="935" y="190" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" text-anchor="middle" fill="#0F172A">× Duration</text>
<text x="935" y="226" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">seconds</text>
<line x1="1035" y1="210" x2="1081" y2="210" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="1095" y="150" width="200" height="120" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="1195" y="190" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" text-anchor="middle" fill="#0F172A">= Size</text>
<text x="1195" y="226" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">bits</text>
<text x="675" y="325" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#0F172A">bits = sample rate × bit depth × channels × duration</text>
<text x="675" y="365" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#64748B">Then divide by 8 for bytes; divide further for KiB / MiB if required.</text>
</svg>