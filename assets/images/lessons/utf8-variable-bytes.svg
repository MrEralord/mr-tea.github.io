<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="500" viewBox="0 0 1250 500" role="img">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#0F172A"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="625" y="42" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" text-anchor="middle" fill="#0F172A">UTF-8 Uses a Variable Number of Bytes</text>
<rect x="80" y="115" width="230" height="245" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="195" y="165" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" text-anchor="middle" fill="#0F172A">A</text>
<text x="195" y="210" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#0F766E">U+0041</text>
<text x="195" y="255" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#0F172A">1 byte</text>
<text x="195" y="305" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#475569">41</text>
<rect x="360" y="115" width="230" height="245" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="475" y="165" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" text-anchor="middle" fill="#0F172A">Ә</text>
<text x="475" y="210" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#0F766E">U+04D8</text>
<text x="475" y="255" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#0F172A">2 bytes</text>
<text x="475" y="305" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#475569">D3 98</text>
<rect x="640" y="115" width="230" height="245" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="755" y="165" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" text-anchor="middle" fill="#0F172A">中</text>
<text x="755" y="210" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#0F766E">U+4E2D</text>
<text x="755" y="255" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#0F172A">3 bytes</text>
<text x="755" y="305" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#475569">E4 B8 AD</text>
<rect x="920" y="115" width="230" height="245" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="1035" y="165" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" text-anchor="middle" fill="#0F172A">🙂</text>
<text x="1035" y="210" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#0F766E">U+1F642</text>
<text x="1035" y="255" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#0F172A">4 bytes</text>
<text x="1035" y="305" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#475569">F0 9F 99 82</text>
<text x="625" y="425" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#0F766E">Therefore, character count alone is not enough to determine UTF-8 storage unless the actual characters are known.</text>
</svg>