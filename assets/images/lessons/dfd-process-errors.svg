<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <style>
    .process { fill: #FCF3CF; stroke: #1C2833; stroke-width: 2px; }
    .line { stroke: #1C2833; stroke-width: 2px; fill: none; }
    .text-bold { font-family: Arial, sans-serif; font-weight: bold; font-size: 14px; fill: #1C2833; }
    .text-title { font-family: Arial, sans-serif; font-weight: bold; font-size: 16px; fill: #E74C3C; }
    .text-normal { font-family: Arial, sans-serif; font-size: 13px; fill: #1C2833; }
    .text-desc { font-family: Arial, sans-serif; font-size: 12px; fill: #566573; font-style: italic; }
    .text-error { font-family: Arial, sans-serif; font-weight: bold; font-size: 14px; fill: #E74C3C; letter-spacing: 1px; }
    .text-fix { font-family: Arial, sans-serif; font-size: 12px; fill: #27AE60; font-weight: bold; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1C2833" />
    </marker>
  </defs>

  <!-- 1. BLACK HOLE -->
  <text x="200" y="50" text-anchor="middle" class="text-title">1. BLACK HOLE</text>
  <text x="200" y="70" text-anchor="middle" class="text-desc">Data goes in, nothing comes out</text>
  
  <g class="process-group">
    <rect x="125" y="120" width="150" height="80" rx="10" class="process" />
    <line x1="125" y1="145" x2="275" y2="145" class="line" />
    <line x1="165" y1="120" x2="165" y2="145" class="line" />
    <text x="145" y="138" class="text-bold" text-anchor="middle">1.0</text>
    <text x="220" y="165" class="text-bold" text-anchor="middle">CALCULATE</text>
    <text x="220" y="180" class="text-bold" text-anchor="middle">TOTAL</text>
  </g>
  <polyline points="20,160 125,160" class="line" marker-end="url(#arrow)" />
  <text x="70" y="150" text-anchor="middle" class="text-normal">Item Prices</text>
  
  <text x="330" y="165" text-anchor="middle" class="text-error">NO OUTPUT</text>

  <text x="200" y="240" text-anchor="middle" class="text-fix">Fix: Add output flow</text>
  <text x="200" y="255" text-anchor="middle" class="text-desc">(e.g., "Total Price")</text>


  <!-- 2. MIRACLE -->
  <text x="600" y="50" text-anchor="middle" class="text-title">2. MIRACLE</text>
  <text x="600" y="70" text-anchor="middle" class="text-desc">Data comes out from nowhere</text>

  <text x="470" y="165" text-anchor="middle" class="text-error">NO INPUT</text>

  <g class="process-group">
    <rect x="525" y="120" width="150" height="80" rx="10" class="process" />
    <line x1="525" y1="145" x2="675" y2="145" class="line" />
    <line x1="565" y1="120" x2="565" y2="145" class="line" />
    <text x="545" y="138" class="text-bold" text-anchor="middle">2.0</text>
    <text x="620" y="165" class="text-bold" text-anchor="middle">GENERATE</text>
    <text x="620" y="180" class="text-bold" text-anchor="middle">INVOICE</text>
  </g>
  
  <polyline points="675,160 780,160" class="line" marker-end="url(#arrow)" />
  <text x="730" y="150" text-anchor="middle" class="text-normal">Invoice Details</text>

  <text x="600" y="240" text-anchor="middle" class="text-fix">Fix: Add input flow</text>
  <text x="600" y="255" text-anchor="middle" class="text-desc">(e.g., "Order Details")</text>


  <!-- 3. GREY HOLE -->
  <text x="1000" y="50" text-anchor="middle" class="text-title">3. GREY HOLE</text>
  <text x="1000" y="70" text-anchor="middle" class="text-desc">Inputs are insufficient to produce outputs</text>

  <g class="process-group">
    <rect x="925" y="120" width="150" height="80" rx="10" class="process" />
    <line x1="925" y1="145" x2="1075" y2="145" class="line" />
    <line x1="965" y1="120" x2="965" y2="145" class="line" />
    <text x="945" y="138" class="text-bold" text-anchor="middle">3.0</text>
    <text x="1020" y="165" class="text-bold" text-anchor="middle">CALCULATE</text>
    <text x="1020" y="180" class="text-bold" text-anchor="middle">NET PAY</text>
  </g>
  
  <polyline points="820,160 925,160" class="line" marker-end="url(#arrow)" />
  <text x="870" y="150" text-anchor="middle" class="text-normal">Employee Name</text>
  
  <polyline points="1075,160 1180,160" class="line" marker-end="url(#arrow)" />
  <text x="1130" y="150" text-anchor="middle" class="text-normal">Net Salary</text>
  
  <text x="1000" y="240" text-anchor="middle" class="text-fix">Fix: Provide necessary inputs</text>
  <text x="1000" y="255" text-anchor="middle" class="text-desc">(e.g., "Gross Pay", "Deductions")</text>
</svg>