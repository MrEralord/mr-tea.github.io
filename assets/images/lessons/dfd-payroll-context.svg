<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <style>
    .entity { fill: #D4E6F1; stroke: #1C2833; stroke-width: 2px; }
    .shadow { fill: #AAB7B8; }
    .process { fill: #FCF3CF; stroke: #1C2833; stroke-width: 2px; }
    .line { stroke: #1C2833; stroke-width: 2px; fill: none; }
    .text-bold { font-family: Arial, sans-serif; font-weight: bold; font-size: 14px; fill: #1C2833; }
    .text-normal { font-family: Arial, sans-serif; font-size: 13px; fill: #1C2833; }
    .title { font-family: Arial, sans-serif; font-weight: bold; font-size: 18px; fill: #1C2833; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1C2833" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="40" class="title">DFD LEVEL 0 (CONTEXT DIAGRAM): PAYROLL SYSTEM</text>

  <!-- Entity Shadows -->
  <rect x="56" y="56" width="160" height="80" class="shadow" />
  <rect x="56" y="256" width="160" height="80" class="shadow" />
  <rect x="796" y="56" width="160" height="80" class="shadow" />
  <rect x="796" y="256" width="160" height="80" class="shadow" />
  <rect x="426" y="486" width="160" height="80" class="shadow" />

  <!-- Entities -->
  <!-- HR -->
  <rect x="50" y="50" width="160" height="80" class="entity" />
  <text x="130" y="85" text-anchor="middle" class="text-bold">HUMAN</text>
  <text x="130" y="105" text-anchor="middle" class="text-bold">RESOURCES</text>

  <!-- EMPLOYEES -->
  <rect x="50" y="250" width="160" height="80" class="entity" />
  <text x="130" y="295" text-anchor="middle" class="text-bold">EMPLOYEES</text>

  <!-- MANAGEMENT -->
  <rect x="790" y="50" width="160" height="80" class="entity" />
  <text x="870" y="95" text-anchor="middle" class="text-bold">MANAGEMENT</text>

  <!-- BANK -->
  <rect x="790" y="250" width="160" height="80" class="entity" />
  <text x="870" y="280" text-anchor="middle" class="text-bold">BANK /</text>
  <text x="870" y="300" text-anchor="middle" class="text-bold">FINANCIAL</text>
  <text x="870" y="320" text-anchor="middle" class="text-bold">INSTITUTIONS</text>

  <!-- GOV -->
  <rect x="420" y="480" width="160" height="80" class="entity" />
  <text x="500" y="510" text-anchor="middle" class="text-bold">GOVERNMENT /</text>
  <text x="500" y="530" text-anchor="middle" class="text-bold">TAX AUTHORITIES</text>

  <!-- Process 0 (Gane & Sarson fix: empty top right section) -->
  <rect x="410" y="240" width="180" height="100" rx="15" class="process" />
  <line x1="410" y1="270" x2="590" y2="270" class="line" />
  <line x1="450" y1="240" x2="450" y2="270" class="line" />
  <text x="430" y="259" text-anchor="middle" class="text-bold">0</text>
  <text x="500" y="305" text-anchor="middle" class="text-bold">PAYROLL</text>
  <text x="500" y="325" text-anchor="middle" class="text-bold">SYSTEM</text>

  <!-- Flows -->
  <!-- HR to Process -->
  <polyline points="130,130 130,200 450,200 450,240" class="line" marker-end="url(#arrow)" />
  <text x="290" y="185" text-anchor="middle" class="text-normal">Employee records /</text>
  <text x="290" y="200" text-anchor="middle" class="text-normal">Pay rate updates</text>

  <!-- Process to MGT -->
  <polyline points="550,240 550,200 870,200 870,130" class="line" marker-end="url(#arrow)" />
  <text x="710" y="190" text-anchor="middle" class="text-normal">Payroll reports</text>

  <!-- EMP to Process -->
  <line x1="210" y1="270" x2="410" y2="270" class="line" marker-end="url(#arrow)" />
  <text x="310" y="262" text-anchor="middle" class="text-normal">Timesheet data / Hours worked</text>

  <!-- Process to EMP -->
  <line x1="410" y1="310" x2="210" y2="310" class="line" marker-end="url(#arrow)" />
  <text x="310" y="302" text-anchor="middle" class="text-normal">Payslips / Payroll details</text>

  <!-- Process to BANK -->
  <line x1="590" y1="270" x2="790" y2="270" class="line" marker-end="url(#arrow)" />
  <text x="690" y="262" text-anchor="middle" class="text-normal">Direct deposit instructions</text>

  <!-- BANK to Process -->
  <line x1="790" y1="310" x2="590" y2="310" class="line" marker-end="url(#arrow)" />
  <text x="690" y="302" text-anchor="middle" class="text-normal">Payment confirmations</text>

  <!-- Process to GOV -->
  <line x1="500" y1="340" x2="500" y2="480" class="line" marker-end="url(#arrow)" />
  <text x="510" y="405" text-anchor="start" class="text-normal">Tax reports /</text>
  <text x="510" y="420" text-anchor="start" class="text-normal">Tax withholding records</text>
</svg>