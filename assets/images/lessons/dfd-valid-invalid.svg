<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="100%" height="100%">
  <style>
    .entity { fill: #D4E6F1; stroke: #1C2833; stroke-width: 2px; }
    .shadow { fill: #AAB7B8; }
    .process { fill: #FCF3CF; stroke: #1C2833; stroke-width: 2px; }
    .store { fill: #FDEBD0; stroke: #1C2833; stroke-width: 2px; fill-opacity: 0; }
    .store-bg { fill: #FDEBD0; }
    .store-id { fill: #D5D8DC; stroke: #1C2833; stroke-width: 2px; }
    .line { stroke: #1C2833; stroke-width: 2px; fill: none; }
    .line-invalid { stroke: #E74C3C; stroke-width: 2.5px; fill: none; }
    .text-bold { font-family: Arial, sans-serif; font-weight: bold; font-size: 13px; fill: #1C2833; }
    .title-invalid { font-family: Arial, sans-serif; font-weight: bold; font-size: 18px; fill: #E74C3C; text-anchor: middle; }
    .title-valid { font-family: Arial, sans-serif; font-weight: bold; font-size: 18px; fill: #27AE60; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1C2833" />
    </marker>
    <marker id="arrow-invalid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E74C3C" />
    </marker>
  </defs>

  <!-- Titles -->
  <text x="235" y="60" class="title-invalid">INVALID CONNECTIONS</text>
  <text x="770" y="60" class="title-valid">VALID CONNECTIONS</text>

  <!-- ROW 1: Entity to Entity -->
  <!-- Invalid -->
  <rect x="54" y="124" width="120" height="60" class="shadow" />
  <rect x="50" y="120" width="120" height="60" class="entity" />
  <text x="110" y="155" class="text-bold" text-anchor="middle">ENTITY</text>
  
  <line x1="170" y1="150" x2="295" y2="150" class="line-invalid" marker-end="url(#arrow-invalid)" />
  
  <rect x="304" y="124" width="120" height="60" class="shadow" />
  <rect x="300" y="120" width="120" height="60" class="entity" />
  <text x="360" y="155" class="text-bold" text-anchor="middle">ENTITY</text>

  <!-- Valid -->
  <rect x="554" y="124" width="120" height="60" class="shadow" />
  <rect x="550" y="120" width="120" height="60" class="entity" />
  <text x="610" y="155" class="text-bold" text-anchor="middle">ENTITY</text>
  
  <line x1="670" y1="150" x2="715" y2="150" class="line" marker-end="url(#arrow)" />
  
  <rect x="720" y="115" width="120" height="70" rx="10" class="process" />
  <line x1="720" y1="135" x2="840" y2="135" class="line" />
  <line x1="750" y1="115" x2="750" y2="135" class="line" />
  <text x="780" y="160" class="text-bold" text-anchor="middle">PROCESS</text>
  
  <line x1="840" y1="150" x2="885" y2="150" class="line" marker-end="url(#arrow)" />
  
  <rect x="894" y="124" width="120" height="60" class="shadow" />
  <rect x="890" y="120" width="120" height="60" class="entity" />
  <text x="950" y="155" class="text-bold" text-anchor="middle">ENTITY</text>


  <!-- ROW 2: Entity to Data Store -->
  <!-- Invalid -->
  <rect x="54" y="264" width="120" height="60" class="shadow" />
  <rect x="50" y="260" width="120" height="60" class="entity" />
  <text x="110" y="295" class="text-bold" text-anchor="middle">ENTITY</text>
  
  <line x1="170" y1="290" x2="295" y2="290" class="line-invalid" marker-end="url(#arrow-invalid)" />
  
  <rect x="300" y="260" width="120" height="60" class="store-bg" />
  <rect x="300" y="260" width="30" height="60" class="store-id" />
  <path d="M 420 260 L 300 260 L 300 320 L 420 320" class="store" />
  <text x="375" y="295" class="text-bold" text-anchor="middle">DATA STORE</text>

  <!-- Valid -->
  <rect x="554" y="264" width="120" height="60" class="shadow" />
  <rect x="550" y="260" width="120" height="60" class="entity" />
  <text x="610" y="295" class="text-bold" text-anchor="middle">ENTITY</text>
  
  <line x1="670" y1="290" x2="715" y2="290" class="line" marker-end="url(#arrow)" />
  
  <rect x="720" y="255" width="120" height="70" rx="10" class="process" />
  <line x1="720" y1="275" x2="840" y2="275" class="line" />
  <line x1="750" y1="255" x2="750" y2="275" class="line" />
  <text x="780" y="300" class="text-bold" text-anchor="middle">PROCESS</text>
  
  <line x1="840" y1="290" x2="885" y2="290" class="line" marker-end="url(#arrow)" />
  
  <rect x="890" y="260" width="120" height="60" class="store-bg" />
  <rect x="890" y="260" width="30" height="60" class="store-id" />
  <path d="M 1010 260 L 890 260 L 890 320 L 1010 320" class="store" />
  <text x="965" y="295" class="text-bold" text-anchor="middle">DATA STORE</text>


  <!-- ROW 3: Data Store to Entity -->
  <!-- Invalid -->
  <rect x="50" y="400" width="120" height="60" class="store-bg" />
  <rect x="50" y="400" width="30" height="60" class="store-id" />
  <path d="M 170 400 L 50 400 L 50 460 L 170 460" class="store" />
  <text x="125" y="435" class="text-bold" text-anchor="middle">DATA STORE</text>
  
  <line x1="170" y1="430" x2="295" y2="430" class="line-invalid" marker-end="url(#arrow-invalid)" />
  
  <rect x="304" y="404" width="120" height="60" class="shadow" />
  <rect x="300" y="400" width="120" height="60" class="entity" />
  <text x="360" y="435" class="text-bold" text-anchor="middle">ENTITY</text>

  <!-- Valid -->
  <rect x="550" y="400" width="120" height="60" class="store-bg" />
  <rect x="550" y="400" width="30" height="60" class="store-id" />
  <path d="M 670 400 L 550 400 L 550 460 L 670 460" class="store" />
  <text x="625" y="435" class="text-bold" text-anchor="middle">DATA STORE</text>
  
  <line x1="670" y1="430" x2="715" y2="430" class="line" marker-end="url(#arrow)" />
  
  <rect x="720" y="395" width="120" height="70" rx="10" class="process" />
  <line x1="720" y1="415" x2="840" y2="415" class="line" />
  <line x1="750" y1="395" x2="750" y2="415" class="line" />
  <text x="780" y="440" class="text-bold" text-anchor="middle">PROCESS</text>
  
  <line x1="840" y1="430" x2="885" y2="430" class="line" marker-end="url(#arrow)" />
  
  <rect x="894" y="404" width="120" height="60" class="shadow" />
  <rect x="890" y="400" width="120" height="60" class="entity" />
  <text x="950" y="435" class="text-bold" text-anchor="middle">ENTITY</text>


  <!-- ROW 4: Data Store to Data Store -->
  <!-- Invalid -->
  <rect x="50" y="540" width="120" height="60" class="store-bg" />
  <rect x="50" y="540" width="30" height="60" class="store-id" />
  <path d="M 170 540 L 50 540 L 50 600 L 170 600" class="store" />
  <text x="125" y="575" class="text-bold" text-anchor="middle">DATA STORE</text>
  
  <line x1="170" y1="570" x2="295" y2="570" class="line-invalid" marker-end="url(#arrow-invalid)" />
  
  <rect x="300" y="540" width="120" height="60" class="store-bg" />
  <rect x="300" y="540" width="30" height="60" class="store-id" />
  <path d="M 420 540 L 300 540 L 300 600 L 420 600" class="store" />
  <text x="375" y="575" class="text-bold" text-anchor="middle">DATA STORE</text>

  <!-- Valid -->
  <rect x="550" y="540" width="120" height="60" class="store-bg" />
  <rect x="550" y="540" width="30" height="60" class="store-id" />
  <path d="M 670 540 L 550 540 L 550 600 L 670 600" class="store" />
  <text x="625" y="575" class="text-bold" text-anchor="middle">DATA STORE</text>
  
  <line x1="670" y1="570" x2="715" y2="570" class="line" marker-end="url(#arrow)" />
  
  <rect x="720" y="535" width="120" height="70" rx="10" class="process" />
  <line x1="720" y1="555" x2="840" y2="555" class="line" />
  <line x1="750" y1="535" x2="750" y2="555" class="line" />
  <text x="780" y="580" class="text-bold" text-anchor="middle">PROCESS</text>
  
  <line x1="840" y1="570" x2="885" y2="570" class="line" marker-end="url(#arrow)" />
  
  <rect x="890" y="540" width="120" height="60" class="store-bg" />
  <rect x="890" y="540" width="30" height="60" class="store-id" />
  <path d="M 1010 540 L 890 540 L 890 600 L 1010 600" class="store" />
  <text x="965" y="575" class="text-bold" text-anchor="middle">DATA STORE</text>

</svg>