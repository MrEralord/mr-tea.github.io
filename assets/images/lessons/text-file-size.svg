<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="440" viewBox="0 0 1300 440" role="img">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#0F172A"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="650" y="42" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" text-anchor="middle" fill="#0F172A">Calculating Text Storage</text>
<rect x="65" y="105" width="520" height="245" rx="16" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/>
<text x="325" y="145" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="800" text-anchor="middle" fill="#0F172A">Fixed-width exam model</text>
<text x="325" y="188" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#0F766E">characters × bits per character</text>
<text x="325" y="230" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#0F172A">÷ 8 = bytes</text>
<text x="325" y="280" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#0F172A">Example: 120 chars × 8 bits ÷ 8</text>
<text x="325" y="315" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#0F172A">= 120 bytes</text>
<rect x="715" y="105" width="520" height="245" rx="16" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/>
<text x="975" y="145" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="800" text-anchor="middle" fill="#0F172A">Variable-width encoding (e.g. UTF-8)</text>
<text x="975" y="188" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" text-anchor="middle" fill="#0F766E">sum the bytes used by each character</text>
<text x="975" y="230" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#0F172A">or use the byte length supplied/calculated</text>
<text x="975" y="280" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#0F172A">A + Ә + 中 + 🙂</text>
<text x="975" y="315" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#0F172A">1 + 2 + 3 + 4 = 10 bytes</text>
<text x="650" y="405" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#0F766E">Always follow the encoding and byte/bit assumptions stated in the question.</text>
</svg>