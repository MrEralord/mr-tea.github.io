<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 760" width="100%" height="100%">
  <style>
    .entity { fill: #D4E6F1; stroke: #1C2833; stroke-width: 2px; }
    .shadow { fill: #AAB7B8; }
    .process { fill: #FCF3CF; stroke: #1C2833; stroke-width: 2px; }
    .store { fill: #FDEBD0; stroke: #1C2833; stroke-width: 2px; }
    .line { stroke: #1C2833; stroke-width: 2px; fill: none; }
    .text-bold { font-family: Arial, sans-serif; font-weight: bold; font-size: 13px; fill: #1C2833; }
    .text-normal { font-family: Arial, sans-serif; font-size: 13px; fill: #1C2833; }
    .title { font-family: Arial, sans-serif; font-weight: bold; font-size: 18px; fill: #1C2833; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1C2833" />
    </marker>
  </defs>

  <!-- Title (XML Entity Escaped) -->
  <text x="670" y="25" class="title">DFD LEVEL 1: PAYROLL SYSTEM (Gane &amp; Sarson Notation)</text>

  <!-- Entity Shadows -->
  <rect x="44" y="44" width="140" height="70" class="shadow" />
  <rect x="44" y="284" width="140" height="70" class="shadow" />
  <rect x="1144" y="44" width="140" height="70" class="shadow" />
  <rect x="1144" y="424" width="140" height="70" class="shadow" />
  <rect x="604" y="624" width="140" height="70" class="shadow" />

  <!-- Entities -->
  <rect x="40" y="40" width="140" height="70" class="entity" />
  <text x="110" y="75" text-anchor="middle" class="text-bold">HUMAN</text>
  <text x="110" y="90" text-anchor="middle" class="text-bold">RESOURCES</text>

  <rect x="40" y="280" width="140" height="70" class="entity" />
  <text x="110" y="320" text-anchor="middle" class="text-bold">EMPLOYEES</text>

  <rect x="1140" y="40" width="140" height="70" class="entity" />
  <text x="1210" y="80" text-anchor="middle" class="text-bold">MANAGEMENT</text>

  <rect x="1140" y="420" width="140" height="70" class="entity" />
  <text x="1210" y="452" text-anchor="middle" class="text-bold">BANK /</text>
  <text x="1210" y="467" text-anchor="middle" class="text-bold">FINANCIAL INST.</text>

  <rect x="600" y="620" width="140" height="70" class="entity" />
  <text x="670" y="652" text-anchor="middle" class="text-bold">GOVERNMENT /</text>
  <text x="670" y="667" text-anchor="middle" class="text-bold">TAX AUTHORITIES</text>

  <!-- Processes -->
  <g class="process-group">
    <rect x="320" y="40" width="150" height="80" rx="10" class="process" />
    <line x1="320" y1="65" x2="470" y2="65" class="line" />
    <line x1="360" y1="40" x2="360" y2="65" class="line" />
    <text x="340" y="58" class="text-bold" text-anchor="middle">2.0</text>
    <text x="415" y="85" class="text-bold" text-anchor="middle">UPDATE</text>
    <text x="415" y="100" class="text-bold" text-anchor="middle">EMPLOYEE</text>
    <text x="415" y="115" class="text-bold" text-anchor="middle">RECORDS</text>
  </g>

  <!-- 1.0 (XML Entity Escaped) -->
  <g class="process-group">
    <rect x="320" y="140" width="150" height="80" rx="10" class="process" />
    <line x1="320" y1="165" x2="470" y2="165" class="line" />
    <line x1="360" y1="140" x2="360" y2="165" class="line" />
    <text x="340" y="158" class="text-bold" text-anchor="middle">1.0</text>
    <text x="415" y="185" class="text-bold" text-anchor="middle">VALIDATE</text>
    <text x="415" y="200" class="text-bold" text-anchor="middle">TIMESHEETS</text>
    <text x="415" y="215" class="text-bold" text-anchor="middle">&amp; DATA</text>
  </g>

  <!-- 3.0 (XML Entity Escaped) -->
  <g class="process-group">
    <rect x="600" y="280" width="150" height="80" rx="10" class="process" />
    <line x1="600" y1="305" x2="750" y2="305" class="line" />
    <line x1="640" y1="280" x2="640" y2="305" class="line" />
    <text x="620" y="298" class="text-bold" text-anchor="middle">3.0</text>
    <text x="695" y="325" class="text-bold" text-anchor="middle">CALCULATE PAY</text>
    <text x="695" y="340" class="text-bold" text-anchor="middle">&amp; DEDUCTIONS</text>
  </g>

  <g class="process-group">
    <rect x="880" y="280" width="150" height="80" rx="10" class="process" />
    <line x1="880" y1="305" x2="1030" y2="305" class="line" />
    <line x1="920" y1="280" x2="920" y2="305" class="line" />
    <text x="900" y="298" class="text-bold" text-anchor="middle">4.0</text>
    <text x="975" y="325" class="text-bold" text-anchor="middle">APPROVE</text>
    <text x="975" y="340" class="text-bold" text-anchor="middle">PAYROLL</text>
  </g>

  <g class="process-group">
    <rect x="880" y="420" width="150" height="80" rx="10" class="process" />
    <line x1="880" y1="445" x2="1030" y2="445" class="line" />
    <line x1="920" y1="420" x2="920" y2="445" class="line" />
    <text x="900" y="438" class="text-bold" text-anchor="middle">5.0</text>
    <text x="975" y="465" class="text-bold" text-anchor="middle">DISBURSE</text>
    <text x="975" y="480" class="text-bold" text-anchor="middle">SALARIES</text>
  </g>

  <g class="process-group">
    <rect x="320" y="420" width="150" height="80" rx="10" class="process" />
    <line x1="320" y1="445" x2="470" y2="445" class="line" />
    <line x1="360" y1="420" x2="360" y2="445" class="line" />
    <text x="340" y="438" class="text-bold" text-anchor="middle">6.0</text>
    <text x="415" y="465" class="text-bold" text-anchor="middle">GENERATE</text>
    <text x="415" y="480" class="text-bold" text-anchor="middle">REPORTS</text>
  </g>

  <!-- Data Stores -->
  <g class="store-group">
    <path d="M 750 180 L 600 180 L 600 220 L 750 220" class="store" />
    <line x1="640" y1="180" x2="640" y2="220" class="line" />
    <text x="620" y="205" class="text-bold" text-anchor="middle">D1</text>
    <text x="695" y="205" class="text-bold" text-anchor="middle">EMPLOYEE DATA</text>
  </g>

  <g class="store-group">
    <path d="M 470 280 L 320 280 L 320 320 L 470 320" class="store" />
    <line x1="360" y1="280" x2="360" y2="320" class="line" />
    <text x="340" y="305" class="text-bold" text-anchor="middle">D2</text>
    <text x="415" y="305" class="text-bold" text-anchor="middle">TIME CARDS</text>
  </g>

  <g class="store-group">
    <path d="M 750 420 L 600 420 L 600 460 L 750 460" class="store" />
    <line x1="640" y1="420" x2="640" y2="460" class="line" />
    <text x="620" y="445" class="text-bold" text-anchor="middle">D3</text>
    <text x="695" y="445" class="text-bold" text-anchor="middle">PAYROLL DB</text>
  </g>

  <!-- Data Flows -->
  <polyline points="180,75 320,75" class="line" marker-end="url(#arrow)" />
  <text x="250" y="55" text-anchor="middle" class="text-normal">Employee records /</text>
  <text x="250" y="70" text-anchor="middle" class="text-normal">Pay rate updates</text>

  <!-- 2.0 to D1 (Routed around 1.0) -->
  <polyline points="470,80 540,80 540,200 600,200" class="line" marker-end="url(#arrow)" />
  <text x="545" y="140" text-anchor="start" class="text-normal">Updated employee records</text>

  <polyline points="180,300 240,300 240,180 320,180" class="line" marker-end="url(#arrow)" />
  <text x="230" y="260" text-anchor="end" class="text-normal">Timesheet data /</text>
  <text x="230" y="275" text-anchor="end" class="text-normal">Hours worked</text>

  <polyline points="395,220 395,280" class="line" marker-end="url(#arrow)" />
  <text x="405" y="255" text-anchor="start" class="text-normal">Validated hours worked</text>

  <!-- D1 to 3.0 (XML Entity Escaped) -->
  <polyline points="675,220 675,280" class="line" marker-end="url(#arrow)" />
  <text x="685" y="255" text-anchor="start" class="text-normal">Salary rates &amp; Tax info</text>

  <polyline points="470,300 600,300" class="line" marker-end="url(#arrow)" />
  <text x="535" y="290" text-anchor="middle" class="text-normal">Hours worked data</text>

  <polyline points="750,300 880,300" class="line" marker-end="url(#arrow)" />
  <text x="815" y="290" text-anchor="middle" class="text-normal">Pending payroll data</text>

  <polyline points="955,280 955,150 1210,150 1210,110" class="line" marker-end="url(#arrow)" />
  <text x="1080" y="140" text-anchor="middle" class="text-normal">Payroll reports for review</text>

  <polyline points="1250,110 1250,200 1000,200 1000,280" class="line" marker-end="url(#arrow)" />
  <text x="1125" y="190" text-anchor="middle" class="text-normal">Approval decisions</text>

  <polyline points="675,360 675,420" class="line" marker-end="url(#arrow)" />
  <text x="665" y="395" text-anchor="end" class="text-normal">Calculated payroll records</text>

  <!-- 4.0 to D3 (Routed around 5.0) -->
  <polyline points="880,320 830,320 830,440 750,440" class="line" marker-end="url(#arrow)" />
  <text x="825" y="380" text-anchor="end" class="text-normal">Approved payroll status</text>

  <polyline points="750,450 880,450" class="line" marker-end="url(#arrow)" />
  <text x="815" y="440" text-anchor="middle" class="text-normal">Approved payroll records</text>

  <polyline points="600,440 470,440" class="line" marker-end="url(#arrow)" />
  <text x="535" y="430" text-anchor="middle" class="text-normal">Approved payroll records</text>

  <polyline points="1030,440 1140,440" class="line" marker-end="url(#arrow)" />
  <text x="1085" y="430" text-anchor="middle" class="text-normal">Direct deposit instructions</text>

  <polyline points="1140,470 1030,470" class="line" marker-end="url(#arrow)" />
  <text x="1085" y="490" text-anchor="middle" class="text-normal">Payment confirmations</text>

  <polyline points="320,460 250,460 250,330 180,330" class="line" marker-end="url(#arrow)" />
  <text x="240" y="395" text-anchor="end" class="text-normal">Payslips /</text>
  <text x="240" y="410" text-anchor="end" class="text-normal">Payroll details</text>

  <polyline points="395,500 395,655 600,655" class="line" marker-end="url(#arrow)" />
  <text x="495" y="635" text-anchor="middle" class="text-normal">Tax reports /</text>
  <text x="495" y="650" text-anchor="middle" class="text-normal">Tax withholding records</text>

  <!-- 6.0 to MGT -->
  <polyline points="430,500 430,720 1290,720 1290,75 1280,75" class="line" marker-end="url(#arrow)" />
  <text x="800" y="710" text-anchor="middle" class="text-normal">Final payroll reports</text>
</svg>