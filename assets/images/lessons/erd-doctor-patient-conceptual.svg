<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif">
  
  <rect width="960" height="540" fill="#ffffff" />

  
  <text x="36" y="52" font-size="32" font-weight="800" fill="#000000">Worked Example: Doctor and Patient</text>
  <text x="36" y="80" font-size="16" fill="#64748b">Logical ERD in Crow's Foot / Barker Notation (Cambridge AS &amp; A Level standard).</text>

  
  <g transform="translate(95, 130)">
    <rect x="0" y="0" width="240" height="145" rx="4" fill="#cbe9ee" stroke="#000000" stroke-width="2" />
    <line x1="0" y1="42" x2="240" y2="42" stroke="#000000" stroke-width="2" />
    <text x="120" y="27" font-size="18" font-weight="800" text-anchor="middle" fill="#000000">DOCTOR</text>

    
    <text x="16" y="72" font-size="15" font-weight="800" fill="#000000">PK</text>
    <text x="54" y="72" font-size="15" font-weight="700" text-decoration="underline" fill="#000000">DoctorID</text>

    <text x="54" y="102" font-size="15" fill="#1e293b">FirstName</text>
    <text x="54" y="130" font-size="15" fill="#1e293b">Specialty</text>
  </g>

  
  <g transform="translate(625, 130)">
    <rect x="0" y="0" width="240" height="145" rx="4" fill="#fce5a6" stroke="#000000" stroke-width="2" />
    <line x1="0" y1="42" x2="240" y2="42" stroke="#000000" stroke-width="2" />
    <text x="120" y="27" font-size="18" font-weight="800" text-anchor="middle" fill="#000000">PATIENT</text>

    
    <text x="16" y="72" font-size="15" font-weight="800" fill="#000000">PK</text>
    <text x="54" y="72" font-size="15" font-weight="700" text-decoration="underline" fill="#000000">PatientID</text>

    <text x="16" y="102" font-size="15" font-weight="800" fill="#dc3545">FK</text>
    <text x="54" y="102" font-size="15" font-style="italic" fill="#000000">DoctorID</text>

    <text x="54" y="130" font-size="15" fill="#1e293b">LastName</text>
  </g>

  
  <g stroke="#000000" stroke-width="2" fill="none">
    
    <line x1="335" y1="202" x2="625" y2="202" />

    
    <line x1="347" y1="190" x2="347" y2="214" />
    <line x1="355" y1="190" x2="355" y2="214" />

    
    <circle cx="601" cy="202" r="6" fill="#ffffff" />
    <line x1="607" y1="202" x2="625" y2="190" />
    <line x1="607" y1="202" x2="625" y2="214" />
  </g>

  
  <text x="480" y="188" font-size="16" font-weight="800" fill="#dc3545" text-anchor="middle">treats (1:M)</text>

  
  <rect x="95" y="340" width="770" height="135" rx="14" fill="#f1f3f5" stroke="#000000" stroke-width="1.5" />
  <text x="122" y="376" font-size="18" font-weight="800" fill="#000000">Read it in both directions (Crow's Foot):</text>
  <text x="122" y="408" font-size="16" fill="#000000">• One DOCTOR treats zero or many PATIENTS (o&lt;).</text>
  <text x="122" y="438" font-size="16" fill="#000000">• Each PATIENT is assigned to one and only one DOCTOR (||) via FK DoctorID.</text>
</svg>