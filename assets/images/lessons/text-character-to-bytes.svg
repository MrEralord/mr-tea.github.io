<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="430" viewBox="0 0 1300 430" role="img">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#0F172A"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="650" y="42" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" text-anchor="middle" fill="#0F172A">How Text Becomes Binary Data</text>
<rect x="65" y="135" width="220" height="135" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="175.0" y="170" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#0F766E">Character</text>
<text x="175.0" y="217" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" text-anchor="middle" fill="#0F172A">Ә</text>
<text x="175.0" y="247" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#64748B">what the user sees</text>
<rect x="390" y="135" width="220" height="135" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="500.0" y="170" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#0F766E">Unicode code point</text>
<text x="500.0" y="217" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" text-anchor="middle" fill="#0F172A">U+04D8</text>
<text x="500.0" y="247" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#64748B">number assigned to character</text>
<rect x="715" y="135" width="220" height="135" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="825.0" y="170" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#0F766E">Encoding</text>
<text x="825.0" y="217" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" text-anchor="middle" fill="#0F172A">UTF-8</text>
<text x="825.0" y="247" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#64748B">rules for storing code point</text>
<rect x="1040" y="135" width="195" height="135" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="1137.5" y="170" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#0F766E">Bytes</text>
<text x="1137.5" y="217" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" text-anchor="middle" fill="#0F172A">D3 98</text>
<text x="1137.5" y="247" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#64748B">binary data in memory/file</text>
<line x1="293" y1="202" x2="378" y2="202" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="618" y1="202" x2="703" y2="202" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="943" y1="202" x2="1028" y2="202" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="650" y="350" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#0F766E">Unicode defines characters/code points; an encoding such as UTF-8 turns them into bytes.</text>
</svg>