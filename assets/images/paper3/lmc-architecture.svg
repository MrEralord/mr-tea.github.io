<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="520" viewBox="0 0 1250 520" role="img">
<defs>
 <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
  <path d="M0 0L10 5L0 10z" fill="#0f172a"/>
 </marker>
</defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="625" y="42" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="800" text-anchor="middle" fill="#0f172a">Little Man Computer — What Changes During Execution</text>
<rect x="70" y="120" width="190" height="90" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="165.0" y="171.0" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#0f172a">INPUT</text>
<rect x="530" y="105" width="230" height="120" rx="16" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
<text x="645.0" y="171.0" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#0f172a">ACCUMULATOR</text>
<rect x="990" y="120" width="190" height="90" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
<text x="1085.0" y="171.0" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#0f172a">OUTPUT</text>
<line x1="260" y1="165" x2="520" y2="165" stroke="#0f172a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="390.0" y="155.0" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">INP</text>
<line x1="770" y1="165" x2="980" y2="165" stroke="#0f172a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="875.0" y="155.0" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">OUT</text>
<rect x="390" y="320" width="470" height="105" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="625.0" y="378.5" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#0f172a">MEMORY / MAILBOXES 00–99</text>
<line x1="590" y1="225" x2="590" y2="310" stroke="#0f172a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="590.0" y="257.5" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">STA: ACC → memory</text>
<line x1="700" y1="310" x2="700" y2="225" stroke="#0f172a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="700.0" y="257.5" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">LDA: memory → ACC</text>
<text x="625" y="475" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#0f766e">ADD / SUB change the accumulator. BRA / BRZ / BRP change which instruction executes next.</text>
</svg>